name: "[TEST] PR Guard - Conversation-based confirm for testing-target"

# Sandbox variant of watchwire-infra's .github/workflows/pr-guard-master-base.yml,
# made stricter: that file only checks for existing threads on `opened`/
# `reopened`, so once the confirmation conversation is resolved, pushing
# more commits to the same PR does NOT reset it -- the merge stays
# unblocked for whatever gets pushed afterward, even though nobody
# confirmed those new changes specifically.
#
# This version runs the same find-or-create logic on every update
# (including `synchronize`), and if it finds its own conversation already
# resolved, un-resolves it -- so each new push re-requires confirmation.
#
# Mechanism:
#  - Looks for an existing review-thread conversation on the PR whose first
#    comment starts with a hidden marker unique to this workflow.
#  - If found and resolved: un-resolves it (forces re-confirmation).
#  - If found and still unresolved: leaves it alone.
#  - If not found at all: posts a new resolvable review comment, anchored
#    to the first addable line in the diff (same technique as
#    pr-guard-master-base.yml), asking for confirmation.
#  - Depends on "Require conversation resolution before merging" being
#    enabled on testing-target's branch ruleset for this to actually block
#    the merge button -- this workflow only manages the conversation state,
#    same division of responsibility as pr-guard-master-base.yml.
#
# This intentionally runs ALONGSIDE pr-guard-testing-target.yml (the
# required-status-check variant already proven on this branch) rather than
# replacing it, so both mechanisms can be observed independently on the
# same PRs.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-guard-conversation-testing-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  confirm-conversation:
    if: ${{ github.event.pull_request.base.ref == 'testing-target' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find, re-lock, or create the confirmation conversation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          MARKER="<!-- pr-guard-conversation-testing-target:confirm-intent -->"

          echo "Looking for an existing conversation from this workflow..."
          THREADS_JSON="$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 1) {
                        nodes { body }
                      }
                    }
                  }
                }
              }
            }' -f owner="${OWNER}" -f repo="${REPO_NAME}" -F number="${PR_NUMBER}")"

          THREAD_ID="$(echo "${THREADS_JSON}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          marker = '${MARKER}'
          for node in data['data']['repository']['pullRequest']['reviewThreads']['nodes']:
              comments = node.get('comments', {}).get('nodes', [])
              if comments and comments[0].get('body', '').startswith(marker):
                  print(node['id'])
                  break
          ")"

          if [ -n "${THREAD_ID}" ]; then
            IS_RESOLVED="$(echo "${THREADS_JSON}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          marker = '${MARKER}'
          for node in data['data']['repository']['pullRequest']['reviewThreads']['nodes']:
              comments = node.get('comments', {}).get('nodes', [])
              if comments and comments[0].get('body', '').startswith(marker):
                  print(str(node['isResolved']).lower())
                  break
          ")"

            if [ "${IS_RESOLVED}" = "true" ]; then
              echo "Existing conversation was resolved -- re-locking for the new changes."
              if OUT="$(gh api graphql -f query='
                mutation($id: ID!) {
                  unresolveReviewThread(input: { threadId: $id }) {
                    thread { isResolved }
                  }
                }' -f id="${THREAD_ID}" 2>&1)"; then
                echo "Conversation reset to unresolved."
              elif echo "${OUT}" | grep -q "Resource not accessible by integration"; then
                echo "::warning::github.token cannot unresolve review threads (same class of restriction seen elsewhere on the ephemeral Actions token). The conversation stays resolved, so new pushes are NOT actually re-blocked yet."
              else
                echo "${OUT}"
                echo "::error::unresolveReviewThread failed for a reason other than the known github.token restriction."
                exit 1
              fi
            else
              echo "Existing conversation already unresolved -- nothing to do."
            fi
            exit 0
          fi

          echo "No existing conversation found; creating one."
          BODY="${MARKER}
          Do you really want to merge into \`testing-target\`? This branch stands in for a protected default branch. Resolve this conversation once you've confirmed -- pushing new commits will re-lock it."

          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate > /tmp/pr_files.json

          ANCHOR="$(python3 - <<'PY'
          import json

          with open("/tmp/pr_files.json") as f:
              files = json.load(f)

          def first_added_line(patch):
              new_line = None
              for line in patch.splitlines():
                  if line.startswith("@@"):
                      plus_part = line.split("+", 1)[1].split("@@")[0].strip()
                      new_line = int(plus_part.split(",")[0])
                      continue
                  if new_line is None:
                      continue
                  if line.startswith("+") and not line.startswith("+++"):
                      return new_line
                  if not line.startswith("-"):
                      new_line += 1
              return None

          for entry in files:
              patch = entry.get("patch")
              if not patch:
                  continue
              line = first_added_line(patch)
              if line:
                  print(f'{entry["filename"]}|{line}')
                  break
          PY
          )"

          if [ -z "${ANCHOR}" ]; then
            echo "No addable line found to anchor a review comment to; falling back to a plain PR comment (NOT gated by conversation resolution)."
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${BODY}"
            exit 0
          fi

          ANCHOR_PATH="${ANCHOR%%|*}"
          ANCHOR_LINE="${ANCHOR##*|}"

          gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            -f body="${BODY}" \
            -f commit_id="${HEAD_SHA}" \
            -f path="${ANCHOR_PATH}" \
            -F line="${ANCHOR_LINE}" \
            -f side="RIGHT" \
            > /dev/null

          echo "Posted resolvable review comment on ${ANCHOR_PATH}:${ANCHOR_LINE}."
